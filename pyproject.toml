# uv workspace のルート。パッケージではなく、member の列挙と共通のツール設定だけ。
# 分離の効き方は CLAUDE.md の「構成」にある。

[tool.uv.workspace]
members = [
    "device",
    "host/link",
    "host/mcp",
    "host/tools",
]

# ツール本体はここに集約する。venv は 1 つなので member ごとに書いても
# 1 バージョンにしかならず、書き分けられるように見せる方が害が大きい。
# member が宣言するのは、その member のコードが必要とするものだけ。
[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.14.0",
]

# ---------------------------------------------------------------- ruff

# ruff の設定は継承ではなく置換される。member 側で `[tool.ruff]` を開くと
# ここの `select` は消えて既定値に戻るので、member には
# `extend = "../../pyproject.toml"` を書いて差分だけを載せること。

[tool.ruff]
line-length = 100
target-version = "py313"
# vendor/ はデバイスから吸い出した upstream ソースで、`.gitignore` に入って
# いるぶん普段は勝手に外れている。それでも明示するのは、パスを直接渡すと
# ruff が gitignore を無視して整形しにくるため。あれは再配布しない代わりに
# ホスト側で唯一の控えなので、書き換えてはいけない。
extend-exclude = ["tmp", "vendor"]

[tool.ruff.lint]
select = [
    "ANN", # annotations must be present
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "RUF",
    "SIM",
    "UP",  # pyupgrade
    "W",
]

[tool.ruff.lint.isort]
known-first-party = [
    "buddy_bridge",
    "buddy_chat",
    "buddy_deploy",
    "buddy_mcp",
    "buddy_serial",
    "buddy_speak",
    "buddy_tts",
    "device_repl",
    "fake_repl",
    "probe_device",
    "provision_wifi",
]

# ルートはテストも型検査の対象も持たない。pytest と basedpyright は
# member ごとに回す (`uv run --directory host/link pytest` のように)。
# ruff だけはここから 1 回で足りる — 上に書いたとおり、member の設定は
# ruff 自身が階層で拾う。
