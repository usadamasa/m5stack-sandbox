# uv workspace のルート。パッケージではなく、member の列挙と共通のツール設定だけ。
# 分離の効き方は CLAUDE.md の「構成」にある。

[tool.uv.workspace]
members = [
    "device",
    "host/link",
    "host/mcp",
    "host/tools",
]

# ツール本体はここに集約する。venv は 1 つなので member ごとに書いても
# 1 バージョンにしかならず、書き分けられるように見せる方が害が大きい。
# member が宣言するのは、その member のコードが必要とするものだけ。
[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "poethepoet>=0.38.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.14.0",
]

# ---------------------------------------------------------------- ruff

# ruff の設定は継承ではなく置換される。member 側で `[tool.ruff]` を開くと
# ここの `select` は消えて既定値に戻るので、member には
# `extend = "../../pyproject.toml"` を書いて差分だけを載せること。

[tool.ruff]
line-length = 100
target-version = "py313"
# vendor/ はデバイスから吸い出した upstream ソースで、`.gitignore` に入って
# いるぶん普段は勝手に外れている。それでも明示するのは、パスを直接渡すと
# ruff が gitignore を無視して整形しにくるため。あれは再配布しない代わりに
# ホスト側で唯一の控えなので、書き換えてはいけない。
extend-exclude = ["tmp", "vendor"]

[tool.ruff.lint]
select = [
    "ANN",     # annotations must be present
    "B",       # bugbear
    "C4",      # comprehensions
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # import order
    "PLR0911", # return が多すぎる
    "PLR0912", # 分岐が多すぎる
    "PLR0913", # 引数が多すぎる
    "PLR0915", # 文が多すぎる
    "RUF",
    "SIM",
    "UP",      # pyupgrade
    "W",
]

# PLR は群では取らない。PLR2004 (マジックナンバー比較) が入ると、
# デバイス側の座標計算とテストの期待値が全部引っかかる。
#
# C901 (循環的複雑度) はここには無い。判定は `poe complexity` のラチェットが
# 持っている — per-file-ignores は有効か無効かの二値で、抑えたファイルの中では
# 複雑度がいくら増えても黙るため。ruff 側は引数や文の数を見る係として残る。

# 複雑度の backlog。ここに載っているのは、ルールを入れた時点で既に超えて
# いた関数を抱えるファイル。行数の baseline と同じで、消えるまでが宿題。
#
# ただしこちらは「これ以上悪くならない」数字を持てない。per-file-ignores は
# 有効か無効かの二値なので、抑えたファイルの中では複雑度がいくら増えても
# 黙る。増加を止めているのは行数のラチェットの方 (`poe lines`)。
#
# device/ のぶんはここに書いても効かない。member 側が per-file-ignores を
# 開くとこの表ごと置換されるので、device の backlog は device/pyproject.toml
# にある。
[tool.ruff.lint.per-file-ignores]
"host/link/src/buddy_bridge.py" = ["PLR0912", "PLR0915"]
"host/link/src/buddy_verbs.py" = ["PLR0913"]
"host/mcp/src/buddy_chatter.py" = ["PLR0913"]
"host/mcp/src/buddy_mcp.py" = ["PLR0913"]
"host/mcp/src/mcp_chatter_tools.py" = ["PLR0913"]
"host/tools/src/buddy_deploy.py" = ["PLR0912", "PLR0913", "PLR0915"]
"host/tools/src/fetch_firmware.py" = ["PLR0912", "PLR0915"]
"host/tools/src/provision_wifi.py" = ["PLR0911"]
"scripts/buddy_chatter_notify.py" = ["PLR0911"]

[tool.ruff.lint.isort]
known-first-party = [
    # device/buddy/ の package。中の chat / serial / speak / tts / debug も
    # ここに掛かる。
    "buddy",
    "buddy_agent",
    "buddy_bridge",
    "buddy_chatter",
    "buddy_deploy",
    "buddy_link",
    "buddy_mcp",
    "buddy_text",
    "buddy_verbs",
    "buddy_wire",
    "deploy_stubs",
    "device_repl",
    "fake_repl",
    "mcp_stubs",
    "probe_device",
    "provision_wifi",
    "resident_link",
]

# ルートはテストも型検査の対象も持たない。pytest と basedpyright は
# member ごとに回す (`uv run --directory host/link pytest` のように)。
# ruff だけはここから 1 回で足りる — 上に書いたとおり、member の設定は
# ruff 自身が階層で拾う。

# ----------------------------------------------------------------- poe

# ライセンス名の羅列を持たずに済ませるため、判定は trivy の分類に任せる。
# trivy は SPDX に正規化したうえで forbidden / restricted / reciprocal /
# notice / permissive に分ける。落とすのはそのうち上位 3 つ (CRITICAL/HIGH/
# MEDIUM) で、AGPL は forbidden、GPL と LGPL は restricted に入る。
#
# UNKNOWN も落とす。trivy の分類表に無いライセンスが素通りするのを避けるため。
# 通しているものは下の `--ignored-licenses` に SPDX ID で並ぶ。中身はいずれも
# permissive だと確認したもので、増えるのは新しい名前が来たときだけ。
# "CUSTOM License: MIT License ..." は rich-click の METADATA が License 欄に
# MIT 全文を入れているせいで trivy が分類できないもの。trivy がその全文を
# 31 文字に切った文字列がそのまま名前になっている。
#
# MIT-CMU は Pillow。SPDX には載っているが trivy の分類表に無いだけで、中身は
# HPND 系の permissive — 著作権表示の保持しか求めず、copyleft の条項は無い。
#
# esptool は GPL-2.0+ で restricted。ファームウェアを焼くときに別プロセスで叩く
# だけの CLI で、import もしなければ再配布もしないため、Apache-2.0 のこのツリーに
# 伝播しない。除外の理由が変わったら (ライブラリとして import する等) ここを
# 外して判断し直すこと。esptool の依存は除外していない。
#
# `rootfs` なのは `fs` が site-packages を読まないため。読ませるには
# インストール済みの `.venv` が要る。`--table-mode detailed` は成功時に
# 何も出させないためで、落ちたときだけ該当パッケージの表が出る。
#
# `aqua exec` を挟むのは PATH に依存しないため。.envrc が通す PATH は
# direnv を hook した対話シェルにしか効かず、そこを踏まない経路 (CI、
# エディタ、Claude Code の Bash) から叩くと trivy が見つからない。
[tool.poe.tasks.license]
help = "依存のライセンスを trivy の分類で検査する"
env = { TRIVY_CACHE_DIR = "tmp/trivy-cache" }
cmd = """
aqua exec -- trivy rootfs .venv
  --scanners license
  --severity CRITICAL,HIGH,MEDIUM,UNKNOWN
  --exit-code 1
  --table-mode detailed
  --quiet
  --skip-dirs "**/esptool*"
  --ignored-licenses "BlueOak-1.0.0,PSF-2.0,MIT-0,MPL-2.0,MIT-CMU,CUSTOM License: MIT License ..."
"""

[tool.poe.tasks.license-list]
help = "依存が名乗るライセンスを分類つきで一覧する (判定はしない)"
env = { TRIVY_CACHE_DIR = "tmp/trivy-cache" }
cmd = "aqua exec -- trivy rootfs .venv --scanners license --quiet --table-mode detailed"

# 行数のラチェット。しきい値 (400 行) を超えたファイルは
# `file-length-baseline.json` に現在値で載り、そこから増やせなくなる。減った
# ぶんは `poe lines --update` が取り込む。上げる方向へは動かないので、
# baseline に並ぶ行数がそのままリファクタリングの backlog になる。
# 仕組みと `--adopt` の意味はスクリプトの docstring にある。
#
# ruff には行数のルールが無く、あったとしてもファイルごとのラチェット値は
# 持てないので自前になっている。
[tool.poe.tasks.lines]
help = "しきい値を超えたファイルの行数が増えていないかを見る"
cmd = "python host/tools/src/check_file_length.py"

# アーキテクチャのメトリクス。関数ごとの循環的複雑度、モジュールの凝集度、
# コンポーネント間の結合度 (Ca/Ce/instability)、依存の循環を出す。
#
# 落ちるのは循環依存があるときだけで、残りは数字を並べるだけ。凝集度にも
# instability にも「正しい値」は無く、しきい値を置くと守るための細工が
# 始まるため。判定を持っているのは ruff (C901) と行数のラチェット。
# 関数ごとの複雑度のラチェット。ruff の C901 をここへ移した — あちらの
# per-file-ignores は有効か無効かの二値で、抑えたファイルの中では複雑度が
# いくら増えても黙るため。baseline は `complexity-baseline.json`。
[tool.poe.tasks.complexity]
help = "しきい値を超えた関数の複雑度が増えていないかを見る"
cmd = "python host/tools/src/check_complexity.py"

[tool.poe.tasks.metrics]
help = "アーキテクチャのメトリクスを測る (複雑度・凝集度・結合度・循環依存)"
cmd = "python host/tools/src/arch_metrics.py"
