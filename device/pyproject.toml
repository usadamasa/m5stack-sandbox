# デバイスの上で動くコード。MicroPython 1.27 (ESP32-S3) 用の distribution では
# ないので package = false。ディレクトリの形はデバイスの /flash/ をそのまま写す。
# 転送のしかたは AGENTS.md のコマンドと `buddy-deploy` skill にある。

[project]
name = "buddy-device"
version = "0.1.0"
description = "Device-side app, transport, chat panel and speech for the Cardputer-Adv."
requires-python = ">=3.13"
# 実行時の依存は無い。デバイスが使うモジュールはファームウェアが持っている。
dependencies = []

[tool.uv]
package = false

[dependency-groups]
# tests/test_chat.py と tests/test_speak.py がホスト側の定数と突き合わせる
# 契約テストなので、テストだけがホストを要る。
dev = ["buddy-host-link"]

[tool.uv.sources]
buddy-host-link = { workspace = true }

# ---------------------------------------------------------------- ruff

[tool.ruff]
extend = "../pyproject.toml"

# MicroPython is not CPython 3.13. pyupgrade would happily rewrite this code
# into syntax the device cannot parse, full annotation coverage is not
# reachable without `typing` (see tests/test_device_constraints.py),
# `contextlib` is not in the firmware at all so SIM105 has no fix available,
# and there is no exception chaining, which leaves B904 with nothing to
# suggest — test_device_constraints.py enforces its absence instead.
#
# tests/ には掛からない。あちらは CPython で走るテストコードなので、
# tests/ruff.toml がルートの設定へ戻している。
[tool.ruff.lint]
ignore = ["ANN", "UP", "SIM105", "B904"]

[tool.ruff.lint.per-file-ignores]
# `/flash` と `/flash/apps` を sys.path に入れてからでないと peer module を
# import できないので、import が冒頭に来ない。E402 はそのぶん。
"apps/*.py" = ["E402"]

# 複雑度の backlog。ルートの同名の表はここを開いた時点で置換されるので、
# device のぶんはルートではなくここに載る。意味と扱いはルート側のコメント。
# 循環的複雑度そのものは `poe complexity` のラチェットが持っている。
#
# PLR0912 (分岐の数) は外れた。`run()` に残る分岐は while と except だけで、
# 描画も畳みも `_serve_ui` / `_shutdown` へ出ている。PLR0915 (文の数) だけが
# 残るのは、`run()` の残りが import と print と代入を順に並べた組み立てその
# もので、段ごとの print が init の途中のハードフォールトを指すパンくずに
# なっているため。分けると起動の順序が読めなくなる方が高くつく。
"buddy/app.py" = ["PLR0915"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# package = false なので editable install が無い。テストから見えるように
# ここを sys.path に入れる。
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------- basedpyright

[tool.basedpyright]
pythonVersion = "3.13"
include = ["."]
exclude = ["**/__pycache__", "typings"]
extraPaths = [".", "../host/link/src"]
stubPath = "typings"
typeCheckingMode = "strict"
# 腐った ignore を検査側から言わせる。意図は host/link/pyproject.toml の
# 同じ設定に書いてある。この tree では特に効く — 下の
# `reportAttributeAccessIssue = "none"` のように群ごと黙らせている規則が
# あり、そこに対する ignore は最初から意味を持たない。
reportUnnecessaryTypeIgnoreComment = "error"
# device/ imports firmware-provided modules (M5, hardware, micropython) and
# upstream peers that live on the device's flash, none of which exist here.
# Their absence is the expected state, not a finding. `typings/` carries
# hand-written stubs for the ones this repository's code actually touches, so
# that the values coming back from them still get real types instead of
# `Unknown` cascading through everything downstream.
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportAttributeAccessIssue = "none"

# host/link (buddy_bridge) は同じ workspace の自前パッケージだが、editable
# install は hatchling の import hook 経由なので basedpyright からは見えない。
# extraPaths でソースを直接指すと import 解決先が「stub の無い外部ライブラリ」
# ではなく通常のソースファイルになるので、reportMissingTypeStubs は出ない。
# include に含めていないので host/link 自身の診断はここには出ない。
# tests/test_chat.py と tests/test_speak.py が buddy_bridge をホスト側の
# 定数突き合わせに使うのはこのため。

# `tests/test_device_constraints.py` enforces, against the AST, that every
# annotation under device/ (excluding tests/) is a bare builtin name — no
# subscripted generics (`dict[str, int]`), because MicroPython's parser sees
# them too and a subscript is a runtime expression, not free syntax like a
# bare name. A PEP 484 `# type:` comment is never parsed by MicroPython at
# all, so it is the only place a generic type argument can be spelled — hence
# both overrides below, which apply to that comment style specifically and to
# nothing else.
reportMissingTypeArgument = "none"
reportTypeCommentUsage = "none"

# -------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    # apps/ はここに無い。import しただけでは起動しなくなり (起動は
    # `claude_buddy.run()`)、ハードウェアのモジュールを要求するのは
    # `buddy/app.py` の `run()` の中だけになったので、両方とも測れる。
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 目標ではなく回帰バー。実測 78%。
fail_under = 75
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
