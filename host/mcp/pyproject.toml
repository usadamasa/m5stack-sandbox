# Claude Code から叩く MCP server。デバイスとの会話は buddy-host-link に
# 任せるので、ここが持つ固有の依存は MCP の SDK だけ。

[project]
name = "buddy-host-mcp"
version = "0.1.0"
description = "MCP server exposing the Cardputer-Adv to Claude Code."
requires-python = ">=3.13"
dependencies = [
    "buddy-host-link",
    "mcp==2.0.0",
]

[tool.uv.sources]
buddy-host-link = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
extend = "../../pyproject.toml"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------- basedpyright

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
typeCheckingMode = "standard"

# -------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 目標ではなく回帰バー。実測 75%。
fail_under = 72
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
