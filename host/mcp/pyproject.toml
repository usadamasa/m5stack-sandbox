# Claude Code から叩く MCP server。デバイスとの会話は buddy-host-link に
# 任せるので、ここが持つ固有の依存は MCP の SDK だけ。

[project]
name = "buddy-host-mcp"
version = "0.1.0"
description = "MCP server exposing the Cardputer-Adv to Claude Code."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "buddy-host-link",
    "mcp==2.0.0",
]

# インストールされた環境から直接叩けるようにする。常駐 daemon はエージェントの
# sandbox の外で走る必要があり、`uv run` は起動したセッションの都合を持ち込む。
# `uv tool install ./host/mcp` か `uvx --from ./host/mcp buddy-mcpd` で入れた
# 実体を叩く方が、どのプロジェクトから起こしても同じものが上がる。
[project.scripts]
buddy-mcp = "buddy_mcp:main"
buddy-mcpd = "buddy_mcpd:main"

[tool.uv.sources]
buddy-host-link = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
extend = "../../pyproject.toml"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------- basedpyright

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src", "../link/src"]
typeCheckingMode = "strict"
# host/link (buddy_bridge, device_repl) は同じ workspace の自前パッケージだが、
# editable install は hatchling の import hook 経由なので basedpyright からは
# 見えない。extraPaths でソースを直接指すと import 解決先が「stub の無い外部
# ライブラリ」ではなく通常のソースファイルになるので、reportMissingTypeStubs
# は出ない。include に含めていないので host/link 自身の診断はここには出ない。

# tests/ は module 内部の状態 (`_device_lock` / `_link` / `_chatter` 等) を
# 直接覗く white-box テストが前提の設計。reportPrivateUsage はここでは
# 無効化する — アンダースコア接頭辞はモジュール外の一般利用者への注意書きで
# あって、同じ package のテストに対するものではない。
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

# -------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 目標ではなく回帰バー。実測 80%。
fail_under = 77
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
