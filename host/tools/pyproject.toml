# 人が明示的に走らせるツール群。実機を仕込むもの — デプロイ (buddy_deploy)、
# WiFi の焼き込み (provision_wifi)、実測の採取 (probe_device)、ファームウェア
# 取得 (fetch_firmware)、フォント生成 (make_vlw) — と、リポジトリを保つもの
# (check_file_length)。どれも MCP server の経路には乗らない。mpy-cross と
# Pillow がここにしか無いのはそのため。

[project]
name = "buddy-host-tools"
version = "0.1.0"
description = "Deploy, provisioning and probing tools for the Cardputer-Adv."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "buddy-host-link",
    # The MicroPython cross-compiler, driven by buddy_deploy.py.
    # Pinned exactly, not floated: bytecode is only portable within one
    # .mpy ABI, and the board runs MicroPython 1.27, which loads v6.
    # A newer mpy-cross would build modules the firmware refuses to
    # import, and the only symptom is an ImportError on the device.
    "mpy-cross==1.27.0.post2",
    # make_vlw.py がグリフをラスタライズするのに使う。VLW は 1 ピクセル
    # 1 バイトのアルファを並べただけの形式なので、必要なのは FreeType に
    # 8bit で描かせる口だけ。fontTools を足さずに済ませているのは、
    # cmap を読まなくても .notdef との一致で未収録文字を弾けるため。
    "pillow>=11.0,<12",
]

[tool.uv.sources]
buddy-host-link = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

# esptool はここに置かない。ファームウェアを焼き直すときだけ要る CLI で、
# GPL-2.0+ なのでロックに入れると `poe license` が拾う。このリポジトリは
# import も再配布もしないので、uv の tool 環境から別プロセスで呼ぶ:
#
#     uvx esptool@5.3.1 --port /dev/cu.usbmodem101 write-flash 0x0 firmware.bin
#
# 以前は dependency group `flash` に置いて opt-in で入れていたが、license の
# CI がそれを入れて `--skip-dirs` で避ける形になり、GPL の CLI 1 つのために
# rich-click の分類不能なライセンス名まで ignore に並んでいた。

# ---------------------------------------------------------------- ruff

[tool.ruff]
extend = "../../pyproject.toml"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------- basedpyright

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
# ../../device は buddy_emu.py のため。エミュレータは `buddy.app` を本物のまま
# import するので、device/ のソースが解決できないと `buddy.*` が全部 Unknown になる。
extraPaths = ["src", "../link/src", "../../device", "../../device/typings"]
# mpy-cross は py.typed を持たず stub パッケージも無いので、触る面だけを写した
# 手書きのスタブを置いてある。既定値と同じ名前だが、device/ と揃えて明示する。
stubPath = "typings"
typeCheckingMode = "strict"
# 腐った ignore を検査側から言わせる。意図は host/link/pyproject.toml の
# 同じ設定に書いてある。
reportUnnecessaryTypeIgnoreComment = "error"
# host/link (buddy_bridge, device_repl, fake_repl) は同じ workspace の自前
# パッケージだが、editable install は hatchling の import hook 経由なので
# basedpyright からは見えない。extraPaths でソースを直接指すと import 解決先が
# 「stub の無い外部ライブラリ」ではなく通常のソースファイルになるので、
# reportMissingTypeStubs は出ない。include に含めていないので host/link 自身の
# 診断はここには出ない。

# -------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 目標ではなく回帰バー。実測 75%。
fail_under = 72
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
