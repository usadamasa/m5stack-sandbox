# デバイスと喋るための土台。REPL transport (device_repl) と、その上に載る
# ホスト側クライアント (buddy_bridge) を持つ。host/mcp と host/tools は
# どちらもここに依存する。

[project]
name = "buddy-host-link"
version = "0.1.0"
description = "USB serial transport and client for the Cardputer-Adv."
# リポジトリの LICENSE と同じ。CI の license ジョブは allow-list 方式で、
# ライセンス未宣言のパッケージは UNKNOWN として落ちる。自分の member も例外ではない。
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # MicroPython's own remote-control tool. Used as a library, not a CLI:
    # `mpremote.transport_serial.SerialTransport` is the raw-paste REPL
    # transport that host/tools/src/buddy_deploy.py drives.
    #
    # 実行時依存。以前は dev group にあったが、MCP server の経路
    # (buddy_mcp -> buddy_bridge -> device_repl) が起動のたびに import する。
    "mpremote>=1.28.0",
    "pyserial==3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# flat module のまま wheel の top-level に載せる。`only-include` があるので
# 隣の tests/ は sys.path に漏れない。
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[dependency-groups]
dev = ["types-pyserial>=3.5.0.20250822"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
extend = "../../pyproject.toml"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------- basedpyright

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
# editable install が入っていれば venv 経由でも引けるが、hatchling の
# editable は import hook なので静的解析からは見えないことがある。
extraPaths = ["src"]
# mpremote は py.typed を持たず stub パッケージも無いので、触る面だけを写した
# 手書きのスタブを置いてある。既定値と同じ名前だが、device/ と揃えて明示する。
stubPath = "typings"
typeCheckingMode = "strict"
# ignore は書いた時点の診断にしか対応していない。スタブが増えたり型が付いたり
# して診断が消えても ignore は残るので、腐ったものを検査側から言わせる。
# これを入れると「ignore を消すために型を付ける」が「型を付けたら ignore が
# 消える」に変わり、残った ignore はどれも現役だと読めるようになる。
reportUnnecessaryTypeIgnoreComment = "error"

# -------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 目標ではなく回帰バー。シリアルポートが実際に刺さっていないと通らない経路を最も多く
# 持つ member なので、ここが 100% に近づくことはない。現在値は `pytest --cov` が言う。
fail_under = 63
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
