version: 2
updates:
  # uv workspace の lockfile はルートの uv.lock 1 つだけ。ルートを指せば member の
  # pyproject.toml と uv.lock を同じ PR で上げる。member のディレクトリを pip で
  # 拾わせると pyproject.toml だけが上がり、CI の `uv sync --locked` で落ちる。
  #
  # 3 つとも group は作らず、パッケージごとに PR を出させる。group の PR が開いた
  # ままだと同じ group の更新が全部止まり、1 つの更新の不具合で他の更新まで
  # 巻き添えになる。
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # mpy-cross の版はボードの MicroPython (1.27、.mpy ABI v6) に合わせて固定している。
      # 上げるとデバイスでの ImportError になり、CI の mpy-build では検出できない。
      # ファームを上げるときに手で動かす。
      - dependency-name: mpy-cross
        versions: [">= 1.28"]

  # Dependabot は `uses:` のタグと actions.lock の SHA を同じ commit で上げるので、
  # CI の actions-lock ジョブ (`gh actions-lock --verify`) を通る。
  #
  # directory: / は .github/workflows/ しか見ず、composite action
  # (.github/actions/*) の uses: を上げないので directories で足す。composite
  # action 側の bump で actions.lock も上がるかは未確認 (2026-10)。actions-lock
  # ジョブで落ちたら、その PR のブランチで `gh actions-lock` を実行する。
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly

  # devShell のツール (uv、trivy など) の版は flake.lock の nixpkgs の rev で決まる。
  # nix の対象は flake.lock の input の更新だけで、security updates は出ない。
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
