version: 2
updates:
  # uv workspace の lockfile はルートの uv.lock 1 つだけ。ルートを指せば member の
  # pyproject.toml と uv.lock を同じ PR で上げる。member のディレクトリを pip で
  # 拾わせると pyproject.toml だけが上がり、CI の `uv sync --locked` で落ちる。
  #
  # github-actions は載せない。版は actions.lock が SHA で固定していて、`uses:` の
  # タグだけを上げる PR は CI の actions-lock ジョブで落ちる。
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # group は作らず、パッケージごとに PR を出させる。group の PR が開いたままだと
    # 同じ group の更新が全部止まり、1 つの更新の不具合で他の更新まで巻き添えになる。
    ignore:
      # mpy-cross の版はボードの MicroPython (1.27、.mpy ABI v6) に合わせて固定している。
      # 上げるとデバイスでの ImportError になり、CI の mpy-build では検出できない。
      # ファームを上げるときに手で動かす。
      - dependency-name: mpy-cross
        versions: [">= 1.28"]
