name: CI

# Everything here runs without a board attached. The device-side tree is
# checked too: its framing logic and its MicroPython constraints are both
# exercised on CPython, which is the point — those are the failures that
# would otherwise only surface on the bench.
#
# uv workspace なので pytest と basedpyright は member ごとに回す。どちらも
# 1 プロセス 1 プロジェクトで、member の設定を読むにはそこで動かすしかない。
# ruff だけはルートから 1 回で足りる — member の設定は ruff 自身が階層で拾う。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # --locked fails rather than silently re-resolving, so a
      # pyproject.toml edit that never made it into uv.lock is caught
      # here instead of drifting.
      - run: uv sync --locked --all-packages
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      # ラチェット 2 本。git ls-files でファイルを挙げるので checkout が要る。
      - run: uv run poe lines
      - run: uv run poe complexity
      # メトリクスは読ませるのが目的なので summary へも出す。落ちるのは
      # 循環依存があるときだけ。
      - name: Architecture metrics
        if: always()
        # shell を書かないと `bash -e {0}` で走り、pipefail が付かない。
        # tee の exit code だけが残って、循環依存で落ちても素通りする。
        shell: bash
        run: |
          printf '### metrics\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          uv run poe metrics | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      # 1 つの member が落ちても残りの結果は見たい。
      fail-fast: false
      matrix:
        member: [device, host/link, host/mcp, host/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --directory ${{ matrix.member }} basedpyright

  # The device runs bytecode, so CPython accepting device/ is not enough:
  # MicroPython's own parser has to accept it too, and it is a different
  # parser. This is the same compile the deploy does, minus the board —
  # a syntax error that would only show up as a failed import on flash
  # fails here instead.
  mpy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run python host/tools/src/buddy_deploy.py --compile-only

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: [device, host/link, host/mcp, host/tools]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --directory ${{ matrix.member }} pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          printf '### %s\n\n' '${{ matrix.member }}' >> "$GITHUB_STEP_SUMMARY"
          uv run --directory ${{ matrix.member }} coverage report --format=markdown \
            >> "$GITHUB_STEP_SUMMARY"

  # workspace を分けた意味がここで回帰する。member 単体で sync したときに
  # 他 member の依存が漏れて入っていないこと、そしてそれで足りることを見る。
  # MCP server は Claude Code が起動のたびに走らせる経路で、デプロイ用の
  # mpy-cross も esptool も、フォント生成用の Pillow も要らない。
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --package buddy-host-mcp
      - name: The MCP server imports without the deploy toolchain
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util as u

          # 起動口。tool を並べた 3 モジュールと mcp_state をここが引く。
          import buddy_mcp_serve  # noqa: F401

          for name in ("mpy_cross", "esptool", "PIL"):
              assert u.find_spec(name) is None, f"{name} leaked into the mcp environment"
          PY

  # trivy は .venv の site-packages を読むので、sync が先に要る。
  # `--all-groups` を付けるのはここだけ。flash グループ (esptool とその依存) は
  # opt-in で入るぶん、他のジョブからは見えない。
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # trivy のバージョンは aqua.yaml が持つ。手元と同じものが入る。
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
      - run: aqua install
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --all-groups
      - run: uv run poe license

  # The single required status check. Branch protection points at this
  # job and nothing else, so adding or renaming a job above only means
  # editing `needs` here — no repository-settings change, and no way to
  # merge past a job that was never registered as required.
  #
  # `if: failure()` is what makes that work: when everything upstream
  # passes this job is skipped, and GitHub counts a skipped required
  # check as satisfied. Any upstream failure (or cancellation) flips the
  # condition and the job fails on purpose.
  ci-status-check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, mpy-build, test, isolation, license]
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
